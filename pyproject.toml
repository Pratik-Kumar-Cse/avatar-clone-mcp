[project]
name = "avatar-clone"
version = "0.1.0"
description = "A MCP server project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.3.0", "requests==2.32.3"]
[[project.authors]]
name = "Pratik Kumar"
email = "pk@rapidinnovation.dev"


[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
avatar-clone = "avatar_clone:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
